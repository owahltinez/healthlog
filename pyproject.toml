[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthlog"
version = "0.3.0"
description = "Read Google Health data, and log explicit nutrient data to it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Healthlog Contributors" }
]
keywords = ["health", "nutrition", "google-health", "macros", "calories", "cli", "fitbit", "weight", "sleep"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "click-agentcli>=0.1.0",
    "click>=8.1",
    "httpx>=0.27.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "mealtime-nutrients>=0.3.0",
]


[project.urls]
Homepage = "https://github.com/owahltinez/healthlog"
Repository = "https://github.com/owahltinez/healthlog"

[project.scripts]
healthlog = "healthlog.cli:app"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# readability's bundled defaults only apply when a project configures no ruff
# settings, so a bare line-length here would silently drop them all.
select = ["E", "W", "F", "I", "N"]
# Renaming a public exception class is a breaking change for a worse name.
ignore = ["N818"]

[tool.hatch.build.targets.wheel]
packages = ["healthlog"]

# One manifest, mapped in at build time. A checked-in copy under healthlog/skills/
# had to be synced by hand and shipped stale docs for two releases when it wasn't.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "healthlog/skills/healthlog/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["healthlog"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
